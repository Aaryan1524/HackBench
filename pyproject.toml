[project]
name = "hackbench"
version = "0.1.0"
description = "Hackathon Forensics: Empirical, blind-first hackathon analysis system"
readme = "README.md"
authors = [
    { name = "Aaryan", email = "agaju003@fiu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "duckdb>=1.0.0",
    "fastapi>=0.141.1",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
    "openai>=3.19.2",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "rich>=13.7.0",
    "selectolax>=0.3.20",
    "typer>=0.12.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hackbench = "hackbench.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
